# Uppdaterar din Supabase automatiskt när koden i supabase/ ändras:
#   1. kör nya databasmigreringar (tabeller, säkerhetsregler, funktioner)
#   2. sparar Claude-nyckeln (om du lagt in den som GitHub-hemlighet)
#   3. publicerar bildtolkningen (Edge Function "analyze-photo")
#
# Kräver tre hemligheter under Settings -> Secrets and variables -> Actions:
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF
# och gärna ANTHROPIC_API_KEY. Se README.
name: Uppdatera Supabase

on:
  push:
    branches: [main, 'claude/**']
    paths: ['supabase/**', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Finns hemligheterna?
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning title=Supabase är inte kopplat än::Lägg in SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD och SUPABASE_PROJECT_REF under Settings -> Secrets and variables -> Actions. Se README."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Koppla till Supabase-projektet
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Uppdatera databasen
        if: steps.check.outputs.ready == 'true'
        run: supabase db push --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Spara Claude-nyckeln i Supabase
        if: steps.check.outputs.ready == 'true' && env.ANTHROPIC_API_KEY != ''
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"

      - name: Publicera bildtolkningen
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy analyze-photo --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
